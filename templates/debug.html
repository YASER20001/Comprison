<!DOCTYPE html>
<html>
<head>
  <title>Debug: Raw Excel Cell Viewer</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 20px; }
    table { border-collapse: collapse; font-size: 12px; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
    th { background: #003366; color: #fff; }
    .empty { color: #ccc; }
    .merged { background: #fff3cd; }
    .info { margin-bottom: 16px; padding: 12px; background: #e8f0fe; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Debug: Raw Excel Cell Viewer</h1>
  <p>Upload your Excel file to see the raw cell values (first 15 rows).</p>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" style="margin: 16px 0; font-size: 16px;" />
  <div id="output"></div>

  <script>
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      document.getElementById('output').innerHTML = '<p>Analyzing...</p>';
      try {
        const resp = await fetch('/api/debug-upload', { method: 'POST', body: fd });
        const data = await resp.json();
        if (data.error) {
          document.getElementById('output').innerHTML = `<p style="color:red">${data.error}</p>`;
          return;
        }

        let html = `<div class="info">
          <b>Sheet:</b> ${data.sheetName} | <b>Max Row:</b> ${data.maxRow} | <b>Max Col:</b> ${data.maxCol}<br>
          <b>Merged Ranges (${data.mergedRanges.length}):</b> ${data.mergedRanges.join(', ') || 'None'}
        </div>`;

        const maxCol = data.rows[0]?.cells?.length || 0;
        html += '<table><thead><tr><th>Row</th>';
        for (let c = 1; c <= maxCol; c++) html += `<th>Col ${c}</th>`;
        html += '</tr></thead><tbody>';

        for (const row of data.rows) {
          html += `<tr><td><b>${row.row}</b></td>`;
          for (const cell of row.cells) {
            const val = cell.resolved;
            const isMerged = cell.raw === 'None' && cell.resolved !== null;
            const cls = val === null ? 'empty' : (isMerged ? 'merged' : '');
            html += `<td class="${cls}" title="raw: ${cell.raw}\nresolved: ${cell.resolved}">${val ?? '<i>null</i>'}</td>`;
          }
          html += '</tr>';
        }
        html += '</tbody></table>';
        document.getElementById('output').innerHTML = html;
      } catch (err) {
        document.getElementById('output').innerHTML = `<p style="color:red">${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
