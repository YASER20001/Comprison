<!DOCTYPE html>
<html>
<head>
  <title>Debug: Raw Excel Cell Viewer</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 10px; }
    h2 { margin-top: 24px; font-size: 14px; color: #003366; }
    table { border-collapse: collapse; font-size: 11px; background: #fff; margin-top: 8px; }
    th, td { border: 1px solid #ccc; padding: 3px 6px; text-align: left; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    th { background: #003366; color: #fff; position: sticky; top: 0; }
    .empty { color: #ccc; }
    .merged { background: #fff3cd; }
    .bold-cell { font-weight: bold; }
    .filled-cell { outline: 2px solid #f58220; }
    .header-row td { background: #c6efce !important; }
    .info { margin: 12px 0; padding: 12px; background: #e8f0fe; border-radius: 8px; font-size: 12px; }
    .strategy { padding: 8px 12px; margin: 4px 0; border-radius: 6px; font-size: 12px; }
    .strategy-hit { background: #d4edda; border: 1px solid #28a745; }
    .strategy-miss { background: #f8f9fa; border: 1px solid #dee2e6; color: #999; }
    .result-box { background: #003366; color: #fff; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 14px; }
    .legend { display: flex; gap: 16px; margin: 12px 0; font-size: 11px; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .legend .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Debug: Raw Excel Cell Viewer</h1>
  <p style="font-size:12px;color:#666;">Upload your Excel file to inspect raw cell values, formatting, merges, and header detection.</p>
  <input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm" style="margin: 12px 0; font-size: 14px;" />
  <div id="output"></div>

  <script>
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      document.getElementById('output').innerHTML = '<p>Analyzing...</p>';
      try {
        const resp = await fetch('/api/debug-upload', { method: 'POST', body: fd });
        const data = await resp.json();
        if (data.error) {
          document.getElementById('output').innerHTML = `<p style="color:red">${data.error}</p>`;
          return;
        }

        let html = '';

        // File info
        html += `<div class="info">
          <b>Sheet:</b> ${data.sheetName} | <b>All Sheets:</b> ${(data.allSheets||[]).join(', ')} |
          <b>Max Row:</b> ${data.maxRow} | <b>Max Col:</b> ${data.maxCol}<br>
          <b>Merged Ranges (${data.mergedRanges.length}):</b> ${data.mergedRanges.slice(0,20).join(', ') || 'None'}
          ${data.mergedRanges.length > 20 ? '...('+data.mergedRanges.length+' total)' : ''}
        </div>`;

        // Detection result
        html += `<div class="result-box">
          DETECTED HEADER: <b>${data.detectedHeaders}</b>
        </div>`;

        // Strategies
        html += '<h2>Detection Strategies</h2>';
        const strats = data.strategies || {};
        for (const [name, info] of Object.entries(strats)) {
          const hit = info.result !== null;
          const cls = hit ? 'strategy-hit' : 'strategy-miss';
          let details = hit ? `→ rows ${info.result[0]}-${info.result[1]}` : '→ no match';
          if (name === 'autofilter') details += info.ref ? ` (ref: ${info.ref})` : ' (no autofilter)';
          if (name === 'tables') details += info.refs?.length ? ` (tables: ${info.refs.join(', ')})` : ' (no tables)';
          html += `<div class="strategy ${cls}"><b>${name}:</b> ${details}</div>`;
        }

        // Legend
        html += `<div class="legend">
          <span><div class="swatch" style="background:#c6efce"></div> Detected header row</span>
          <span><div class="swatch" style="background:#fff3cd"></div> Merged (resolved from master)</span>
          <span><div class="swatch" style="font-weight:bold;font-size:14px">B</div> Bold cell</span>
          <span><div class="swatch" style="outline:2px solid #f58220;background:#fff"></div> Has fill color</span>
        </div>`;

        // Parse detected header range
        const hMatch = data.detectedHeaders.match(/rows (\d+)-(\d+)/);
        const hStart = hMatch ? parseInt(hMatch[1]) : -1;
        const hEnd = hMatch ? parseInt(hMatch[2]) : -1;

        // Cell table
        const maxCol = data.rows[0]?.cells?.length || 0;
        html += '<h2>Raw Cell Data (first 15 rows)</h2>';
        html += '<div style="overflow-x:auto;max-width:100%"><table><thead><tr><th>Row</th>';
        for (let c = 1; c <= maxCol; c++) html += `<th>Col ${c}</th>`;
        html += '</tr></thead><tbody>';

        for (const row of data.rows) {
          const isHeader = row.row >= hStart && row.row <= hEnd;
          html += `<tr class="${isHeader ? 'header-row' : ''}"><td><b>${row.row}</b></td>`;
          for (const cell of row.cells) {
            const val = cell.resolved;
            const isMerged = cell.raw === 'None' && cell.resolved !== null;
            let cls = val === null ? 'empty' : (isMerged ? 'merged' : '');
            if (cell.bold) cls += ' bold-cell';
            if (cell.fill) cls += ' filled-cell';
            const title = `raw: ${cell.raw}\\nresolved: ${cell.resolved}\\nbold: ${cell.bold}\\nfill: ${cell.fill||'none'}`;
            html += `<td class="${cls}" title="${title}">${val ?? '<i>null</i>'}</td>`;
          }
          html += '</tr>';
        }
        html += '</tbody></table></div>';
        document.getElementById('output').innerHTML = html;
      } catch (err) {
        document.getElementById('output').innerHTML = `<p style="color:red">${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
